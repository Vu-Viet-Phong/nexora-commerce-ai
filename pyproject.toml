[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora-commerce-ai"
version = "0.1.0"
description = "E-Commerce Intelligence project"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "openpyxl",
    "pyarrow",
    "scikit-learn",
    "SQLAlchemy",
    "psycopg[binary]",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
